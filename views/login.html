<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Přihlášení – SocialNet</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-brand">
      <div class="brand-logo">SN</div>
      <h1>SocialNet</h1>
      <p>Tvoje sociální síť</p>
    </div>
    <div class="auth-card">
      <h2>Přihlášení</h2>
      <div id="error-msg" class="alert alert-error hidden"></div>
      <div class="form-group">
        <label for="username">Uživatelské jméno</label>
        <input type="text" id="username" placeholder="Vaše jméno" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Heslo</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button id="login-btn" class="btn btn-primary btn-full">Přihlásit se</button>
      <p class="auth-link">Nemáte účet? <a href="/register">Zaregistrujte se</a></p>
    </div>
  </div>
  <script>
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('error-msg');

    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      err.classList.add('hidden');
      if (!username || !password) { showErr('Vyplňte všechna pole'); return; }
      btn.disabled = true; btn.textContent = 'Přihlašuji...';
      try {
        const r = await fetch('/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const d = await r.json();
        if (d.success) { window.location.href = '/wall'; }
        else { showErr(d.error || 'Chyba přihlášení'); }
      } catch { showErr('Chyba sítě'); }
      finally { btn.disabled = false; btn.textContent = 'Přihlásit se'; }
    }

    function showErr(msg) { err.textContent = msg; err.classList.remove('hidden'); }

    btn.addEventListener('click', login);
    document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
