<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrace – SocialNet</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-brand">
      <div class="brand-logo">SN</div>
      <h1>SocialNet</h1>
      <p>Vytvořte si účet</p>
    </div>
    <div class="auth-card">
      <h2>Registrace</h2>
      <div id="error-msg" class="alert alert-error hidden"></div>
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">Jméno *</label>
          <input type="text" id="firstName" placeholder="Jan">
        </div>
        <div class="form-group">
          <label for="lastName">Příjmení *</label>
          <input type="text" id="lastName" placeholder="Novák">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="age">Věk *</label>
          <input type="number" id="age" placeholder="18" min="1" max="120">
        </div>
        <div class="form-group">
          <label for="gender">Pohlaví *</label>
          <select id="gender">
            <option value="">Vyberte...</option>
            <option value="male">Muž</option>
            <option value="female">Žena</option>
            <option value="other">Jiné</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="username">Uživatelské jméno *</label>
        <input type="text" id="username" placeholder="uzivatel123" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Heslo *</label>
        <input type="password" id="password" placeholder="min. 6 znaků" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="avatar">Profilová fotografie</label>
        <div class="file-upload-area" id="avatar-drop">
          <input type="file" id="avatar" accept=".jpg,.jpeg,.png" class="file-input">
          <div class="file-upload-label">
            <span class="file-icon">📷</span>
            <span id="avatar-label-text">Klikněte nebo přetáhněte obrázek</span>
          </div>
          <img id="avatar-preview" class="avatar-preview hidden">
        </div>
      </div>
      <button id="register-btn" class="btn btn-primary btn-full">Vytvořit účet</button>
      <p class="auth-link">Máte účet? <a href="/login">Přihlaste se</a></p>
    </div>
  </div>
  <script>
    const btn = document.getElementById('register-btn');
    const err = document.getElementById('error-msg');
    const avatarInput = document.getElementById('avatar');
    const preview = document.getElementById('avatar-preview');
    const labelText = document.getElementById('avatar-label-text');

    avatarInput.addEventListener('change', () => {
      const file = avatarInput.files[0];
      if (!file) return;
      if (!['image/jpeg', 'image/png'].includes(file.type)) {
        alert('Povolené jsou pouze soubory .jpg a .png');
        avatarInput.value = '';
        labelText.textContent = 'Klikněte nebo přetáhněte obrázek';
        preview.classList.add('hidden');
        return;
      }
      labelText.textContent = file.name;
      const reader = new FileReader();
      reader.onload = e => { preview.src = e.target.result; preview.classList.remove('hidden'); };
      reader.readAsDataURL(file);
    });

    async function register() {
      err.classList.add('hidden');
      const firstName = document.getElementById('firstName').value.trim();
      const lastName  = document.getElementById('lastName').value.trim();
      const age       = parseInt(document.getElementById('age').value);
      const gender    = document.getElementById('gender').value;
      const username  = document.getElementById('username').value.trim();
      const password  = document.getElementById('password').value;

      if (!firstName || !lastName || !age || !gender || !username || !password)
        return showErr('Vyplňte všechna povinná pole');
      if (age < 13)
        return showErr('Musíte být starší 13 let pro registraci');
      if (password.length < 6)
        return showErr('Heslo musí mít alespoň 6 znaků');

      const fd = new FormData();
      fd.append('firstName', firstName);
      fd.append('lastName',  lastName);
      fd.append('age',       age);
      fd.append('gender',    gender);
      fd.append('username',  username);
      fd.append('password',  password);
      if (avatarInput.files[0]) fd.append('avatar', avatarInput.files[0]);

      btn.disabled = true; btn.textContent = 'Registruji...';
      try {
        const r = await fetch('/register', { method: 'POST', body: fd });
        const d = await r.json();
        if (d.success) { window.location.href = '/wall'; }
        else { showErr(d.error || 'Chyba registrace'); }
      } catch { showErr('Chyba sítě'); }
      finally { btn.disabled = false; btn.textContent = 'Vytvořit účet'; }
    }

    function showErr(msg) { err.textContent = msg; err.classList.remove('hidden'); err.scrollIntoView({ behavior: 'smooth' }); }

    btn.addEventListener('click', register);
  </script>
</body>
</html>
